name: AutoWorker data ingest

# Polls configured data sources on a schedule and updates the persistent
# tracker issue. The agent reads the tracker as its primary input each
# pass.
#
# Enabled sources are configured in .autoworker/sources.yml. Built-in
# collectors live in .github/scripts/autoworker_sources/. Add your own
# by dropping a Python module in that directory that exposes
# `collect(config: dict) -> dict`.
#
# REPO SECRETS (set what you use):
#   - BOT_URL, DIAGNOSTICS_TOKEN     (for the diagnostics_endpoint source)
#   - X_BEARER_TOKEN                 (for the social_x source — opt-in)
#   - GITHUB_TOKEN                    (provided automatically, used for
#                                      the github_signals source)
#
# If `browser_usability` is enabled in .autoworker/sources.yml, the
# workflow installs Playwright + headless Chromium on the fly (~30s
# overhead per run). Screenshots are uploaded as a workflow artifact
# named `autoworker-browser-screenshots`.

on:
  schedule:
    - cron: '{{CRON_CADENCE}}'
  workflow_dispatch:
    inputs:
      hours_window:
        description: 'Lookback window for time-bounded sources'
        required: false
        default: '24'

permissions:
  issues: write
  contents: read

concurrency:
  group: autoworker-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install Playwright (if browser_usability is enabled)
        id: pw
        run: |
          if grep -E '^\s*-\s*browser_usability(\s*:|\s*$)' .autoworker/sources.yml 2>/dev/null; then
            echo "Installing Playwright + headless Chromium..."
            pip install playwright
            playwright install chromium --with-deps
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser_usability not enabled — skipping Playwright install."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run data ingest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HOURS: ${{ github.event.inputs.hours_window || '24' }}
          BOT_URL: ${{ secrets.BOT_URL }}
          DIAGNOSTICS_TOKEN: ${{ secrets.DIAGNOSTICS_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python .github/scripts/autoworker_data_ingest.py

      - name: Upload browser screenshots (if any)
        if: ${{ steps.pw.outputs.enabled == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autoworker-browser-screenshots
          path: autoworker_screenshots/
          if-no-files-found: ignore
          retention-days: 30
